name: Validate TESR-U TinyDash admin preview

on:
  push:
    branches:
      - inspect/tinydash-template

permissions:
  contents: read

jobs:
  validate-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check admin/assets/js/admin.js
      - name: Validate admin asset references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          root = Path(".")
          html = (root / "admin/index.html").read_text()
          css = (root / "admin/assets/css/admin.css").read_text()
          js = (root / "admin/assets/js/admin.js").read_text()

          class Parser(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)

          Parser().feed(html)

          refs = re.findall(r'(?:href|src)="(/admin/[^"]+)"', html)
          missing = [ref for ref in refs if not (root / ref.lstrip("/")).is_file()]
          if missing:
              raise SystemExit("Missing admin assets: " + ", ".join(missing))

          for required in ["#view-root", "#current-section", "#admin-sidebar", "#editor-modal", "#toast-region"]:
              if required not in html:
                  raise SystemExit("Missing required HTML hook: " + required)

          for hook in ['getElementById("view-root")', 'getElementById("current-section")', 'getElementById("admin-sidebar")', 'getElementById("editor-modal")', 'getElementById("toast-region")']:
              if hook not in js:
                  raise SystemExit("Missing JS hook: " + hook)

          if "app-light.css" not in html or "feather.css" not in html:
              raise SystemExit("TinyDash light theme stylesheets are not linked")

          if "app-dark.css" in html or "simplebar.min.js" in html:
              raise SystemExit("Unused template assets are still referenced")

          print("HTML parsed; all local asset references and dashboard hooks are present.")
          PY
